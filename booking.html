<html lang="en">

<meta charset="UTF-8">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">TravelGo</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="packages.html">Packages</a></li>
                <li class="nav-item"><a class="nav-link" href="destination.html">Destinations</a></li>
                <li class="nav-item"><a class="nav-link active" href="booking.html">Booking</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">

    <h1 class="text-center mb-4">Book Your Trip</h1>

    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow p-4">

                <form>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Select Destination</label>
                        <select class="form-select">
                            <option>Select Destination</option>
                            <option>Goa</option>
                            <option>Manali</option>
                            <option>Dubai</option>
                            <option>Kerala</option>
                            <option>Paris</option>
                            <option>Bali</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Travel Date</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Number of Persons</label>
                        <input type="number" class="form-control" min="1">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Book Now
                    </button>

                </form>

            </div>

        </div>
    </div>

</div>
<footer class="bg-primary text-white text-center p-3">
 <p class="mb-0">© 2026 TravelGo. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
